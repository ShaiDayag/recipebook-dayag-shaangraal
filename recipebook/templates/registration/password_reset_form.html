{% extends 'ledger/base.html' %}
{% load static %}
{% block title %}Password Reset Request{% endblock %}
{% block content %}
    <h3>Password Reset Request</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% comment %} <input type="submit" value="Reset password"> {% endcomment %}
        <button type="submit">Reset password</button>
    </form>
{% endblock %}
