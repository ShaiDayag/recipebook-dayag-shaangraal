{% extends 'base.html' %}
{% load static %}
{% block title %}Recipe List{% endblock %}
{% block content %}

<h2>Recipe List</h2>
<ul>
    {% for recipe in Recipe.objects.all %}
    <li>
        <a href={{ recipe.get_absolute_url }}>{{ recipe.__str__ }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
